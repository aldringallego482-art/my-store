<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://maxcdn.bootstrapcdn.com https://ajax.googleapis.com; img-src 'self' data:;">
<title>Sign in — Online Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --ink:#1c1b1a;
    --panel:#242322;
    --panel-2:#2c2a29;
    --mist:#8fd6d0;
    --mist-soft:#c9b8f2;
    --paper:#f3efe8;
    --line:#3a3836;
    --error:#e8836b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(60% 50% at 15% 10%, rgba(143,214,208,0.10), transparent 60%),
      radial-gradient(50% 40% at 90% 85%, rgba(201,184,242,0.10), transparent 60%),
      var(--ink);
    color:var(--paper);
    font-family: "Iowan Old Style","Georgia",serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .wrap{
    width:100%;
    max-width:380px;
  }
  .brand{
    text-align:left;
    margin-bottom:28px;
  }
  .brand .mark{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12px;
    letter-spacing:.14em;
    color:var(--mist);
  }
  .brand h1{
    margin:6px 0 0;
    font-size:28px;
    font-weight:500;
    letter-spacing:.01em;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:28px;
  }
  .toggle{
    display:flex;
    border:1px solid var(--line);
    border-radius:5px;
    overflow:hidden;
    margin-bottom:22px;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:13px;
  }
  .toggle button{
    flex:1;
    padding:9px 0;
    background:transparent;
    color:var(--paper);
    border:none;
    cursor:pointer;
    opacity:.55;
  }
  .toggle button.active{
    background:var(--panel-2);
    opacity:1;
    color:var(--mist);
  }
  label{
    display:block;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12px;
    color:#b9b4ac;
    margin:14px 0 6px;
  }
  input{
    width:100%;
    padding:10px 12px;
    background:var(--ink);
    border:1px solid var(--line);
    border-radius:4px;
    color:var(--paper);
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:14px;
  }
  input:focus{
    outline:2px solid var(--mist);
    outline-offset:1px;
    border-color:var(--mist);
  }
  .hint{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:11px;
    color:#8a857c;
    margin-top:5px;
  }
  .submit{
    width:100%;
    margin-top:22px;
    padding:12px 0;
    background:var(--mist);
    color:#16302c;
    border:none;
    border-radius:4px;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .submit:hover{ background:#a3e2dc; }
  .msg{
    margin-top:14px;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:13px;
    min-height:16px;
  }
  .msg.error{ color:var(--error); }
  .msg.ok{ color:var(--mist); }
  .foot{
    margin-top:18px;
    text-align:center;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:11px;
    color:#7d786f;
    line-height:1.6;
  }
  .age{
    display:flex;
    align-items:flex-start;
    gap:8px;
    margin-top:16px;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12px;
    color:#b9b4ac;
  }
  .age input{ width:auto; margin-top:2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark">ONLINE STORE</div>
    <h1>Sign in to continue</h1>
  </div>

  <div class="card">
    <div class="toggle">
      <button type="button" id="tabLogin" class="active">Log in</button>
      <button type="button" id="tabSignup">Create account</button>
    </div>

    <form id="loginForm">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" required autocomplete="username">
      <label for="loginPass">Password</label>
      <input type="password" id="loginPass" required autocomplete="current-password">
      <button type="submit" class="submit">Log in</button>
    </form>

    <form id="signupForm" style="display:none">
      <label for="signupName">Name</label>
      <input type="text" id="signupName" required autocomplete="name">
      <label for="signupEmail">Email</label>
      <input type="email" id="signupEmail" required autocomplete="username">
      <label for="signupPass">Password</label>
      <input type="password" id="signupPass" required autocomplete="new-password" minlength="8">
      <div class="hint">At least 8 characters.</div>
      <div class="age">
        <input type="checkbox" id="ageCheck" required>
        <label for="ageCheck" style="margin:0;color:#b9b4ac;">I confirm I am 21 years of age or older.</label>
      </div>
      <button type="submit" class="submit">Create account</button>
    </form>

    <div id="msg" class="msg"></div>
  </div>

  <div class="foot">
    Demo authentication stored in this browser only.<br>
    Not a substitute for a real server-side login system.
  </div>
</div>

<script>
/*
  ⚠️ DEMO-ONLY AUTH
  ------------------
  This runs entirely in the visitor's browser and stores accounts in
  localStorage. It is fine for a prototype, but it is NOT secure:
  anyone can open dev tools and read or edit "users", passwords are
  not hashed, and there is no real session/token system. Before this
  goes live with real customers, replace it with a proper backend
  (e.g. Node/Express + a database, or an auth provider like Auth0 /
  Firebase Auth / Supabase Auth) that:
    - hashes passwords (bcrypt/argon2), never stores them in plain text
    - issues secure, httpOnly session cookies or signed JWTs
    - serves the whole site over HTTPS
    - rate-limits login attempts
*/

const USERS_KEY = "store_users";
const SESSION_KEY = "store_session";

function getUsers(){
  return JSON.parse(localStorage.getItem(USERS_KEY) || "{}");
}
function saveUsers(users){
  localStorage.setItem(USERS_KEY, JSON.stringify(users));
}
function setMsg(text, kind){
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = "msg " + (kind || "");
}

// tabs
const tabLogin = document.getElementById("tabLogin");
const tabSignup = document.getElementById("tabSignup");
const loginForm = document.getElementById("loginForm");
const signupForm = document.getElementById("signupForm");

tabLogin.addEventListener("click", () => {
  tabLogin.classList.add("active");
  tabSignup.classList.remove("active");
  loginForm.style.display = "block";
  signupForm.style.display = "none";
  setMsg("");
});
tabSignup.addEventListener("click", () => {
  tabSignup.classList.add("active");
  tabLogin.classList.remove("active");
  signupForm.style.display = "block";
  loginForm.style.display = "none";
  setMsg("");
});

// signup
signupForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const name = document.getElementById("signupName").value.trim();
  const email = document.getElementById("signupEmail").value.trim().toLowerCase();
  const pass = document.getElementById("signupPass").value;

  const users = getUsers();
  if (users[email]) {
    setMsg("An account with that email already exists.", "error");
    return;
  }
  users[email] = { name, pass }; // demo only — plain text, see note above
  saveUsers(users);
  localStorage.setItem(SESSION_KEY, JSON.stringify({ email, name }));
  setMsg("Account created. Redirecting…", "ok");
  setTimeout(() => (window.location.href = "store.html"), 500);
});

// login
loginForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim().toLowerCase();
  const pass = document.getElementById("loginPass").value;

  const users = getUsers();
  const user = users[email];
  if (!user || user.pass !== pass) {
    setMsg("Incorrect email or password.", "error");
    return;
  }
  localStorage.setItem(SESSION_KEY, JSON.stringify({ email, name: user.name }));
  setMsg("Welcome back. Redirecting…", "ok");
  setTimeout(() => (window.location.href = "store.html"), 400);
});

// if already logged in, skip straight to the store
if (localStorage.getItem(SESSION_KEY)) {
  window.location.href = "store.html";
}
</script>
</body>
</html>
